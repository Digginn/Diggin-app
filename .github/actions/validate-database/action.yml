name: Validate database
description: Validate migrations and deployment guards using disposable local databases.
runs:
  using: composite
  steps:
    - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
      with:
        version: 2.120.0

    - name: Validate migrations on a disposable local database
      id: local_db
      shell: bash
      run: |
        supabase db start
        supabase db reset --local --no-seed
        supabase test db --local
        supabase db lint --local --schema public,private --fail-on error
        supabase db advisors --local --level warn --fail-on error
        CSV_IMPORT_TEST_DB_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres npm exec --yes --package=deno@2.5.6 -- deno test --allow-env --allow-net --config supabase/functions/deno.json supabase/functions/csv-import/database_test.ts

    - name: Test shared database deployment guards
      shell: bash
      run: |
        node --test scripts/shared-db-approval.test.cjs scripts/production-db-approval.test.cjs
        python3 -m unittest discover -s scripts -p 'test_deploy_shared_db.py'

    - name: Remove the disposable local database
      if: always() && steps.local_db.outcome != 'skipped' && steps.local_db.outcome != ''
      shell: bash
      run: supabase stop --no-backup

    - name: Validate folder-first CSV migration recovery
      shell: bash
      run: python3 scripts/validate_csv_migration_recovery.py

    - name: Validate direct-block-first profanity migration recovery
      shell: bash
      run: python3 scripts/validate_csv_migration_recovery.py --profanity
