name: Deploy production database

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/*shared_db*.py"
      - "scripts/shared-db-approval.test.cjs"
      - "scripts/*migration_recovery*.py"
      - ".github/workflows/deploy-shared-db.yml"
      - ".github/workflows/deploy-production-db.yml"
      - ".github/actions/validate-database/**"
      - ".github/actions/validate-functions/**"
      - "scripts/production-db-approval.test.cjs"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/*shared_db*.py"
      - "scripts/shared-db-approval.test.cjs"
      - "scripts/*migration_recovery*.py"
      - ".github/workflows/deploy-shared-db.yml"
      - ".github/workflows/deploy-production-db.yml"
      - ".github/actions/validate-database/**"
      - ".github/actions/validate-functions/**"
      - "scripts/production-db-approval.test.cjs"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: supabase-production-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - name: Require an approved pull request
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const pullRequests = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { ...context.repo, commit_sha: context.sha, per_page: 100 }
            );
            const mergedPr = pullRequests.find((pr) =>
              pr.merged_at &&
              pr.base.ref === "main" &&
              pr.base.repo.full_name === `${context.repo.owner}/${context.repo.repo}` &&
              pr.merge_commit_sha === context.sha
            );
            if (!mergedPr) {
              core.setFailed("The deploy commit must be a pull request merged into main. Direct pushes cannot deploy.");
              return;
            }
            const { repository } = await github.graphql(`
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) { reviewDecision }
                }
              }
            `, { ...context.repo, number: mergedPr.number });
            if (repository.pullRequest.reviewDecision !== "APPROVED") {
              core.setFailed("An approved PR is required to deploy the production database.");
            }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record the exact commit to deploy
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate database and deployment guards
        uses: ./.github/actions/validate-database

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, validate_functions]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.120.0

      - name: Apply pending migrations to the production database
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_POOLER_HOST: ${{ vars.SUPABASE_DB_POOLER_HOST }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          for name in SUPABASE_PROJECT_ID SUPABASE_DB_POOLER_HOST SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name in the production environment. See docs/PRODUCTION_DB_DEPLOYMENT.md."
              exit 1
            fi
          done
          DB_URL="$(python3 - <<'PY'
          import os
          import re
          from urllib.parse import quote

          project = os.environ["SUPABASE_PROJECT_ID"]
          host = os.environ["SUPABASE_DB_POOLER_HOST"]
          if not re.fullmatch(r"[a-z]{20}", project):
              raise SystemExit("Invalid SUPABASE_PROJECT_ID: expected a project ref.")
          if not re.fullmatch(r"[a-z0-9-]+\.pooler\.supabase\.com", host):
              raise SystemExit("Invalid SUPABASE_DB_POOLER_HOST: copy the Session pooler hostname from Connect.")
          if project != "hymfhaowjyzuennxphfz":
              raise SystemExit("Production deployment must target Diggin-pro, not development.")
          password = quote(os.environ["SUPABASE_DB_PASSWORD"], safe="")
          print(f"postgresql://postgres.{project}:{password}@{host}:5432/postgres?sslmode=require")
          PY
          )"
          echo "::add-mask::$DB_URL"
          export DB_URL
          python3 scripts/deploy_shared_db.py

      - name: Deploy Edge Functions after migrations
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          supabase functions deploy admin-moderation --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy account-restriction --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy account-withdrawal --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy notification-push --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy csv-import --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy apple-token --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy underage-cleanup --project-ref "$SUPABASE_PROJECT_ID"

      - name: Report the deployed commit
        env:
          DEPLOY_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          printf '### Production DB deployment completed\n\nCommit: `%s`\n' "$DEPLOY_COMMIT" >> "$GITHUB_STEP_SUMMARY"

  validate_functions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check and test Edge Functions
        uses: ./.github/actions/validate-functions
