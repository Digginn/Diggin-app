name: Generate community schema artifact
on:
  pull_request:
    branches: [develop]
    paths: ["supabase/schemas/**", ".github/workflows/community-schema-artifact.yml"]
permissions:
  contents: read
jobs:
  generate:
    if: github.head_ref == 'feat/94-community-read'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.120.0
      - run: supabase db schema declarative sync -f community_read --no-apply
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: community-migration
          path: supabase/migrations/*community_read.sql
          if-no-files-found: error
      - run: |
          supabase db start
          supabase db reset --local --no-seed
          supabase test db --local
          supabase db lint --local --schema public,private --fail-on error
          supabase db advisors --local --level warn --fail-on error
          supabase gen types --lang typescript --local > /tmp/community-database.types.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: community-types
          path: /tmp/community-database.types.ts
      - if: always()
        run: supabase stop --no-backup
